[package]
name = "webvowl_legacy"
version = "0.0.2"
edition = "2024"
authors = ["Kneckerino", "KristianEmilWN", "nikarnik", "TheRealMorgenfrue"]
repository = "https://github.com/WebVOWL/WebVOWL"
license-file = "src/main/rust/LICENSE"
readme = "src/main/rust/README.md"
description = "A Rust utility library for WebVOWL Legacy"
keywords = ["vowl", "webvowl"]

[lib]
path = "src/main/rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[package.metadata.wasm-pack.profile.release]
# Execute very expensive optimization passes to further optimize the wasm binary
wasm-opt = ['-O4']

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"
console_error_panic_hook = { version = "0.1.7" }   #, optional = true }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
# https://docs.rs/web-sys/latest/web_sys/#modules
features = ["console", "File", "Blob"]
